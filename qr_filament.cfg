[gcode_macro _QRF_HANDLE_FILAMENT_SCAN]
variable_enabled: 1
variable_material: ""
variable_color: ""
gcode:
    {% set enabled = printer["gcode_macro _QRF_HANDLE_FILAMENT_SCAN"].enabled %}

    {% if enabled != 0 and printer.print_stats.state != "printing" %}
        SET_GCODE_VARIABLE MACRO=_QRF_HANDLE_FILAMENT_SCAN VARIABLE=material VALUE='"{params.MATERIAL}"'
        SET_GCODE_VARIABLE MACRO=_QRF_HANDLE_FILAMENT_SCAN VARIABLE=color VALUE='"{params.COLOR}"'

        _QRF_SAVE_CHANNEL_STATES
        _QRF_SHOW_FILAMENT_SCAN_POPUP

        {% set old_led = printer["led chamber_led"].color_data[0][3]|float %}
        {% if old_led == 0 %}
            LED S=50
        {% else %}
            LED S=0
        {% endif %}
        G4 P250
        M400
        LED S={old_led * 100}

        SET_GCODE_VARIABLE MACRO=_QRF_HANDLE_FILAMENT_SCAN VARIABLE=enabled VALUE=0
        UPDATE_DELAYED_GCODE ID=_QRF_FILAMENT_SCAN_CHECK_IFS DURATION=2
    {% endif %}

[gcode_macro _QRF_SHOW_FILAMENT_SCAN_POPUP]
gcode:
    {% set material = printer["gcode_macro _QRF_HANDLE_FILAMENT_SCAN"].material %}
    {% set color = printer["gcode_macro _QRF_HANDLE_FILAMENT_SCAN"].color %}
    {% set color_limit = printer["zmod_ifs"].color_limit|int %}

    UPDATE_DELAYED_GCODE ID=_QRF_FILAMENT_SCAN_AUTO_TIMEOUT DURATION=30

    RESPOND TYPE=command MSG="action:prompt_begin Filament Loading"
    RESPOND TYPE=command MSG="action:prompt_text Detected material:"
    RESPOND TYPE=command MSG="action:prompt_button {material} : {color}|_QRF_SHOW_FILAMENT_SCAN_POPUP|primary|{color}"
    RESPOND TYPE=command MSG="action:prompt_text Select slot to assign to, or insert filament into IFS"

    {% for i in range(color_limit) %}
        {% if i % 4 == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% endif %}
        RESPOND TYPE=command MSG="action:prompt_button Channel {i + 1}|_QRF_SET_SCAN_FILAMENT_CHANNEL CHANNEL={i + 1}|primary"
        {% if i % 4 == 3 or i == color_limit - 1 %}
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
        {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_QRF_END_FILAMENT_SCAN_POPUP|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _QRF_SET_SCAN_FILAMENT_CHANNEL]
gcode:
    {% set channel = params.CHANNEL|int %}
    {% set material = printer["gcode_macro _QRF_HANDLE_FILAMENT_SCAN"].material %}
    {% set color = printer["gcode_macro _QRF_HANDLE_FILAMENT_SCAN"].color %}

    CHANGE_ZCOLOR SLOT={channel} TYPE={material} HEX={color} SILENT=1
    _QRF_END_FILAMENT_SCAN_POPUP

[gcode_macro _QRF_END_FILAMENT_SCAN_POPUP]
gcode:
    SET_GCODE_VARIABLE MACRO=_QRF_HANDLE_FILAMENT_SCAN VARIABLE=enabled VALUE=1
    UPDATE_DELAYED_GCODE ID=_QRF_FILAMENT_SCAN_AUTO_TIMEOUT DURATION=0
    UPDATE_DELAYED_GCODE ID=_QRF_FILAMENT_SCAN_CHECK_IFS DURATION=0
    RESPOND TYPE=command MSG="action:prompt_end"

[delayed_gcode _QRF_FILAMENT_SCAN_AUTO_TIMEOUT]
gcode:
    {% if printer.print_stats.state == "printing" %}
        SET_GCODE_VARIABLE MACRO=_QRF_HANDLE_FILAMENT_SCAN VARIABLE=enabled VALUE=1
        UPDATE_DELAYED_GCODE ID=_QRF_FILAMENT_SCAN_CHECK_IFS DURATION=0
    {% else %}
        _QRF_SHOW_FILAMENT_SCAN_POPUP
    {% endif %}

[gcode_macro _QRF_SAVE_CHANNEL_STATES]
variable_states: ""
gcode:
    {% set color_limit = printer["zmod_ifs"].color_limit|int %}
    {% set data = [] %}
    {% set port_data = printer["zmod_ifs"].Ports %}
    {% for i in range(color_limit) %}
        {% if port_data[i] %}
            {% set _ = data.append("1") %}
        {% else %}
            {% set _ = data.append("0") %}
        {% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_QRF_SAVE_CHANNEL_STATES VARIABLE=states VALUE='"{data|join("")}"'

[delayed_gcode _QRF_FILAMENT_SCAN_CHECK_IFS]
gcode:
    {% if printer.print_stats.state != "printing" %}
        {% set color_limit = printer["zmod_ifs"].color_limit|int %}
        {% set old_states = printer["gcode_macro _QRF_SAVE_CHANNEL_STATES"].states %}
        {% set port_data = printer["zmod_ifs"].Ports %}
        {% set target_port = [] %}
        {% for i in range(color_limit) %}
            {% if port_data[i] and old_states[i] == "0" %}
                {% set _ = target_port.append(i) %}
            {% endif %}
        {% endfor %}

        {% if target_port|length > 0 %}
            _QRF_SET_SCAN_FILAMENT_CHANNEL CHANNEL={target_port[0] + 1}
        {% else %}
            UPDATE_DELAYED_GCODE ID=_QRF_FILAMENT_SCAN_CHECK_IFS DURATION=2
        {% endif %}
    {% endif %}